name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: CollabProjectUpdater-CLI
  GUI_NAME: CollabProjectUpdater
  VPK_VERSION: 1.2.161   # keep equal to the Velopack package version in FCPModUpdater.Gui.csproj

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Test
        run: dotnet test --configuration Release

      - name: Build Windows x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win-x64-sc
          cp ./update-collab-project-updater.bat ./publish/win-x64-sc/

      - name: Build Linux x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux-x64-sc
          cp ./update-collab-project-updater.sh ./publish/linux-x64-sc/
          cp ./collab-project-updater.desktop ./publish/linux-x64-sc/

      - name: Build Windows x64 (framework-dependent)
        run: dotnet publish FCPModUpdater.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o ./publish/win-x64-fd

      - name: Build Linux x64 (framework-dependent)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=false -o ./publish/linux-x64-fd
          cp ./collab-project-updater.desktop ./publish/linux-x64-fd/

      - name: Build GUI Windows x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/gui-win-x64
          cp ./update-collab-project-updater.bat ./publish/gui-win-x64/

      - name: Build GUI Linux x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/gui-linux-x64
          cp ./update-collab-project-updater.sh ./collab-project-updater-gui.desktop ./FCPModUpdater.Gui/Assets/collab_logo.png ./publish/gui-linux-x64/

      # Velopack: Windows Setup.exe/Portable.zip (cross-packed here) and the self-updating Linux AppImage.
      # Channels must match VelopackAppUpdater.Channel; explicit names keep the two -full.nupkg files apart.
      - name: Build GUI installers (Velopack)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE: ${{ contains(github.ref_name, '-') && '--pre' || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${{ github.repository }}"
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r win-x64 --self-contained true -o ./vp/win-x64
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r linux-x64 --self-contained true -o ./vp/linux-x64
          # The previous release's package lets vpk build delta updates; there is none before the first Velopack release.
          vpk download github --repoUrl "$REPO" --token "$GH_TOKEN" $PRE --channel win-x64 -o ./vp/Releases || true
          vpk download github --repoUrl "$REPO" --token "$GH_TOKEN" $PRE --channel linux-x64 -o ./vp/Releases || true
          vpk "[win]" pack -u ${{ env.GUI_NAME }} -v "$VERSION" -c win-x64 -p ./vp/win-x64 -e ${{ env.GUI_NAME }}.exe \
            -i ./FCPModUpdater.Gui/Assets/app.ico --packTitle "Collaboration Project Updater" \
            --packAuthors "Fallout Collaboration Project" --shortcuts Desktop,StartMenuRoot -o ./vp/Releases
          vpk pack -u ${{ env.GUI_NAME }} -v "$VERSION" -c linux-x64 -p ./vp/linux-x64 -e ${{ env.GUI_NAME }} \
            -i ./FCPModUpdater.Gui/Assets/collab_logo.png --packTitle "Collaboration Project Updater" \
            --packAuthors "Fallout Collaboration Project" --categories Utility -o ./vp/Releases
          mkdir -p ./publish/velopack
          mv ./vp/Releases/*.AppImage ./publish/${{ env.GUI_NAME }}-x86_64.AppImage
          # Only this version's packages; older ones (downloaded for deltas) are already on their releases.
          cp ./vp/Releases/*-"$VERSION"-*.nupkg ./vp/Releases/releases.*.json ./vp/Releases/assets.*.json \
            ./vp/Releases/*-Setup.exe ./vp/Releases/*-Portable.zip ./publish/velopack/

      - name: Create archives
        run: |
          cp ./update-collab-project-updater.bat ./publish/
          cp ./update-collab-project-updater.sh ./publish/
          cd ./publish
          chmod +x linux-x64-sc/${{ env.APP_NAME }} linux-x64-sc/update-collab-project-updater.sh gui-linux-x64/${{ env.GUI_NAME }} gui-linux-x64/update-collab-project-updater.sh
          zip -r "${{ env.APP_NAME }}-win-x64-selfcontained.zip" win-x64-sc
          tar -czvf "${{ env.APP_NAME }}-linux-x64-selfcontained.tar.gz" linux-x64-sc
          zip -r "${{ env.APP_NAME }}-win-x64.zip" win-x64-fd
          tar -czvf "${{ env.APP_NAME }}-linux-x64.tar.gz" linux-x64-fd
          zip -r "${{ env.GUI_NAME }}-win-x64.zip" gui-win-x64
          tar -czvf "${{ env.GUI_NAME }}-linux-x64.tar.gz" gui-linux-x64
          sha256sum *.zip *.tar.gz *.AppImage velopack/*-Setup.exe velopack/*-Portable.zip | sed 's| velopack/| |' > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-downloads.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ./publish/${{ env.APP_NAME }}-win-x64-selfcontained.zip
            ./publish/${{ env.APP_NAME }}-linux-x64-selfcontained.tar.gz
            ./publish/${{ env.APP_NAME }}-win-x64.zip
            ./publish/${{ env.APP_NAME }}-linux-x64.tar.gz
            ./publish/${{ env.GUI_NAME }}-win-x64.zip
            ./publish/${{ env.GUI_NAME }}-linux-x64.tar.gz
            ./publish/${{ env.GUI_NAME }}-x86_64.AppImage
            ./publish/velopack/*
            ./publish/checksums.txt
            ./publish/update-collab-project-updater.bat
            ./publish/update-collab-project-updater.sh
