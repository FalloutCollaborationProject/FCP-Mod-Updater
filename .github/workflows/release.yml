name: Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: FCPModUpdater
  GUI_NAME: FCPModManager

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Test
        run: dotnet test --configuration Release

      - name: Build Windows x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/win-x64-sc
          cp ./update-fcp-mod-manager.bat ./publish/win-x64-sc/

      - name: Build Linux x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux-x64-sc
          cp ./update-fcp-mod-manager.sh ./publish/linux-x64-sc/
          cp ./fcp-mod-manager.desktop ./publish/linux-x64-sc/

      - name: Build Windows x64 (framework-dependent)
        run: dotnet publish FCPModUpdater.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o ./publish/win-x64-fd

      - name: Build Linux x64 (framework-dependent)
        run: |
          dotnet publish FCPModUpdater.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=false -o ./publish/linux-x64-fd
          cp ./fcp-mod-manager.desktop ./publish/linux-x64-fd/

      - name: Build GUI Windows x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/gui-win-x64
          cp ./update-fcp-mod-manager.bat ./publish/gui-win-x64/

      - name: Build GUI Linux x64 (self-contained)
        run: |
          dotnet publish FCPModUpdater.Gui/FCPModUpdater.Gui.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/gui-linux-x64
          cp ./update-fcp-mod-manager.sh ./fcp-mod-manager-gui.desktop ./FCPModUpdater.Gui/Assets/fcp_logo.png ./publish/gui-linux-x64/

      - name: Build GUI AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync desktop-file-utils
          ./packaging/build-appimage.sh ./publish/gui-linux-x64 ./publish

      - name: Create archives
        run: |
          cp ./update-fcp-mod-manager.bat ./publish/
          cp ./update-fcp-mod-manager.sh ./publish/
          cd ./publish
          chmod +x linux-x64-sc/${{ env.APP_NAME }} linux-x64-sc/update-fcp-mod-manager.sh gui-linux-x64/${{ env.GUI_NAME }} gui-linux-x64/update-fcp-mod-manager.sh
          zip -r "${{ env.APP_NAME }}-win-x64-selfcontained.zip" win-x64-sc
          tar -czvf "${{ env.APP_NAME }}-linux-x64-selfcontained.tar.gz" linux-x64-sc
          zip -r "${{ env.APP_NAME }}-win-x64.zip" win-x64-fd
          tar -czvf "${{ env.APP_NAME }}-linux-x64.tar.gz" linux-x64-fd
          zip -r "${{ env.GUI_NAME }}-GUI-win-x64.zip" gui-win-x64
          tar -czvf "${{ env.GUI_NAME }}-GUI-linux-x64.tar.gz" gui-linux-x64
          sha256sum "${{ env.APP_NAME }}"-*.zip "${{ env.APP_NAME }}"-*.tar.gz "${{ env.GUI_NAME }}"-*.zip "${{ env.GUI_NAME }}"-*.tar.gz "${{ env.GUI_NAME }}"-*.AppImage > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-downloads.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ./publish/${{ env.APP_NAME }}-win-x64-selfcontained.zip
            ./publish/${{ env.APP_NAME }}-linux-x64-selfcontained.tar.gz
            ./publish/${{ env.APP_NAME }}-win-x64.zip
            ./publish/${{ env.APP_NAME }}-linux-x64.tar.gz
            ./publish/${{ env.GUI_NAME }}-GUI-win-x64.zip
            ./publish/${{ env.GUI_NAME }}-GUI-linux-x64.tar.gz
            ./publish/${{ env.GUI_NAME }}-GUI-x86_64.AppImage
            ./publish/${{ env.GUI_NAME }}-GUI-x86_64.AppImage.zsync
            ./publish/checksums.txt
            ./publish/update-fcp-mod-manager.bat
            ./publish/update-fcp-mod-manager.sh
